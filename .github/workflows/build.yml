name: Build

# Runs on every push (all branches) and on every pull request.
# Purpose: run the regression suite on both platforms the plugin claims
# to support, and prove that the release packaging is reproducible
# across them (identical SHA-256 from the POSIX and the Windows
# packaging scripts).
# Releases are NOT published here — artifacts are signed locally and
# uploaded to GitHub Releases by hand (see CONTRIBUTING.md).
on:
  push:
  pull_request:
  workflow_dispatch:

# Restrict the GITHUB_TOKEN to the minimum required — read-only checkout.
permissions:
  contents: read

# Cancel any in-progress run for the same ref so a fast-follow push does
# not queue up behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-pack-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install -y vim xxd
      - name: Run the regression suite
        run: test/run-tests.sh
      # The suite cannot do this: it needs a multi-gigabyte file, which is
      # why the script is separate and normally run by hand. In CI it is
      # worth the minutes because it is the only check that a page past
      # 2 GiB is written where it says - and on Linux it also exercises the
      # splice, which is the path Windows now avoids entirely.
      - name: Check a file over 2 GiB
        timeout-minutes: 20
        run: |
          df -h "$RUNNER_TEMP" | sed 's/^/  /'
          # Three times the fixture at peak here: the file, the whole-file
          # temp the shrink splices through, and the ':w {file}' copy.
          TMPDIR="$RUNNER_TEMP" test/check-large-file.sh
      - name: Package the release tarball
        run: ./pack-release
      - name: Record the tarball hash
        run: sha256sum dist/*.tar | tee linux.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-linux
          path: |
            dist/*.tar
            linux.sha256

  # The oldest Vim the plugin claims to work on, built and actually run.
  #
  # This job exists because the claim rotted twice while it was a manual
  # ritual: a recipe in CLAUDE.md, a build by hand, and a list of expected
  # failures to be compared by eye. Nobody ran it for a year, and the second
  # time nobody ran it the inspector's whole block table was dead on this
  # Vim - correct on every Vim CI did run, so nothing said a word. A version
  # floor is only as true as its last run.
  #
  # It is cheap: about a minute to build, and the suite knows what this Vim
  # cannot do (writes that change a file's length need readblob() with an
  # offset, patch 9.0.0795) and checks that they are refused instead. So the
  # result here is the same "All tests passed" as everywhere else, and any
  # new use of a function or a syntax younger than 8.0 fails the build
  # rather than waiting to be discovered by a user on RHEL 8, which ships
  # exactly this series.
  test-oldest-vim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned by COMMIT, not by the archive tarball's digest: GitHub
      # regenerates those and their hashes have changed under people before,
      # while a commit id cannot. This is the v8.0.0000 tag.
      VIM_TAG: v8.0.0000
      VIM_COMMIT: bb76f24af2010943387ce696a7092175b4ecccf2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install what the build needs
        # xxd from the distribution, not from this tree: Vim 8.0's own
        # xxd.c has K&R prototypes that no current GCC compiles, and a user
        # on such a Vim would have the distribution's xxd too.
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev xxd
      - name: Build Vim ${{ env.VIM_TAG }}
        run: |
          git clone --depth 1 --branch "$VIM_TAG" \
              https://github.com/vim/vim.git "$RUNNER_TEMP/vim"
          cd "$RUNNER_TEMP/vim"
          got=$(git rev-parse HEAD)
          if [ "$got" != "$VIM_COMMIT" ]; then
              echo "$VIM_TAG is $got, expected $VIM_COMMIT" >&2
              exit 1
          fi
          # -std=gnu89 is NOT optional on a current compiler: configure's own
          # "is uint32_t 32 bits" probe is a K&R main() that calls exit()
          # with no <stdlib.h>, which a modern default standard rejects - and
          # configure reports that as "WRONG! uint32_t not defined correctly"
          # rather than as a compiler error.
          CFLAGS="-O1 -w -std=gnu89" ./configure --with-features=normal \
              --disable-gui --without-x --disable-nls --with-tlib=ncurses
          # From src/: 8.0's top-level Makefile has no `vim` target, and
          # plain `make` stops at xxd/xxd.c (see above).
          make -C src -j"$(nproc)" vim
          ./src/vim --version | head -2
      - name: Run the regression suite
        run: |
          HEXPAIR_VIM=$RUNNER_TEMP/vim/src/vim \
          VIMRUNTIME=$RUNNER_TEMP/vim/runtime \
              test/run-tests.sh

  test-and-pack-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows is the platform the plugin's portability rules exist for -
      # xxd.exe from $VIMRUNTIME instead of a POSIX toolchain - so it is
      # the one where running the suite is worth the install time.
      #
      # The Vim project's own Windows zip, pinned to a version and checked
      # against its SHA-256, rather than a package manager: it extracts to
      # a path this step can compute, carries the xxd.exe the suite calls
      # beside vim.exe, and cannot change under us. Bump VIM_VERSION and
      # VIM_SHA256 together, in their own commit.
      - name: Install Vim
        shell: pwsh
        env:
          VIM_VERSION: 9.2.0992
          VIM_SHA256: a41e9fc94a50649bae88a43c54902a3e61c560c649e16ab821ce9fb9cf365c7b
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/vim/vim-win32-installer/releases/download/v$env:VIM_VERSION/gvim_${env:VIM_VERSION}_x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'vim.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:VIM_SHA256) { throw "$url has sha256 $got, expected $env:VIM_SHA256" }
          tar -xf $zip -C $env:RUNNER_TEMP
          $short = 'vim' + ($env:VIM_VERSION -replace '^(\d+)\.(\d+).*', '$1$2')
          $dir = Join-Path $env:RUNNER_TEMP (Join-Path 'vim' $short)
          foreach ($exe in 'vim.exe', 'xxd.exe') {
            if (-not (Test-Path (Join-Path $dir $exe))) { throw "$exe is not in $dir" }
          }
          Write-Host "Vim and xxd: $dir"
          # Name them for the suite instead of relying on PATH order: a
          # Git Bash step puts Git's own MSYS Vim first no matter what is
          # prepended here, and that one understands POSIX paths - it would
          # pass the suite while proving nothing about native Windows.
          $fwd = $dir -replace '\\', '/'
          Add-Content -Path $env:GITHUB_ENV -Value "HEXPAIR_VIM=$fwd/vim.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "HEXPAIR_XXD=$fwd/xxd.exe"
      # This job has hung inside the 4 GiB straddle block, which is the
      # first place the suite starts PowerShell - hexpair reaches offsets
      # past 2 GiB that way, since xxd seeks with a 32-bit long on Windows
      # (see hexpair-windows-2gib in doc/hexpair.txt). That block is
      # skipped here for now, which lets the rest of the suite run but
      # explains nothing.
      #
      # This measures the thing that would explain it. The bare runs say
      # whether PowerShell starts on this runner at all and what a cold
      # start costs; the third says whether it starts when a native
      # Windows Vim asks through system(), which is what hexpair actually
      # does and the only one of the three that matches the failing path.
      #
      # Diagnostic, not gating: continue-on-error so a runner without
      # PowerShell reports rather than blocks, and a timeout of its own
      # because "it hangs" is a possible answer and finding that out
      # should cost three minutes rather than fifteen.
      - name: Probe PowerShell, including the way hexpair calls it
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: |
          probe() {
            start=$(date +%s)
            powershell -NoProfile -NonInteractive -Command "exit 0"
            echo "  $1: exit=$? elapsed=$(( $(date +%s) - start ))s"
          }
          probe "bare, cold"
          probe "bare, warm"

          # Through Vim's system(), with the arguments hexpair actually
          # uses - -InputFormat None included, so this measures the real
          # call and not an approximation of it. The bare runs above are
          # always fine even where this one is not, which is exactly why
          # it has to be asked separately.
          printf '%s\n' \
            'let t = reltime()' \
            "call system('powershell -NoProfile -NonInteractive -InputFormat None -Command exit 0')" \
            "call writefile([printf('exit=%d elapsed=%.1fs shell=%s', v:shell_error, reltimefloat(reltime(t)), &shell)], 'probe.out')" \
            'qa!' > probe.vim
          "$HEXPAIR_VIM" -es -u NONE -S probe.vim < /dev/null || echo "  vim itself exited $?"
          if [ -f probe.out ]; then
            echo "  through Vim's system(), -InputFormat None: $(cat probe.out)"
          else
            echo "  through Vim's system(): NO OUTPUT - system() did not return"
          fi
          rm -f probe.vim probe.out

      # Git Bash, so the one suite runs on both platforms; it converts its
      # own paths to the drive-letter form that a native Vim understands.
      # The MS-Windows check is the point of the job: an MSYS Vim would
      # pass every test and mean nothing, so fail loudly rather than
      # quietly test the wrong binary.
      - name: Run the regression suite
        shell: bash
        timeout-minutes: 15
        run: |
          "$HEXPAIR_VIM" --version | head -2
          "$HEXPAIR_VIM" --version | grep -q 'MS-Windows' || {
            echo "$HEXPAIR_VIM is not a native Windows Vim - refusing to pretend this tested Windows" >&2
            exit 1
          }
          test/run-tests.sh
      # The one check that native Windows past 2 GiB does what it claims:
      # PowerShell seeks, .NET writes, and every byte is verified against a
      # pattern predicted from its own offset. Nothing else in this job
      # reaches those offsets - the suite's 4 GiB block is skipped here on
      # purpose, and for a different reason (see run-tests.sh).
      #
      # `shell: cmd` and not bash: the driver runs Vim itself, and doing
      # that from a batch file rather than from anything with a PowerShell
      # or an MSYS layer above it is the whole design (see the .cmd).
      - name: Check a file over 2 GiB
        shell: cmd
        timeout-minutes: 30
        run: test\check-large-file.cmd
      - name: Package the release tarball
        shell: cmd
        run: pack-release.cmd
      - name: Record the tarball hash
        shell: pwsh
        run: (Get-FileHash dist\*.tar -Algorithm SHA256).Hash.ToLower() + '  ' + (Get-Item dist\*.tar).Name | Tee-Object windows.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-windows
          path: |
            dist/*.tar
            windows.sha256

  reproducibility-check:
    needs: [test-and-pack-linux, test-and-pack-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Compare cross-platform hashes
        run: |
          l=$(awk '{print $1}' tarball-linux/linux.sha256)
          w=$(awk '{print $1}' tarball-windows/windows.sha256)
          echo "linux:   $l"
          echo "windows: $w"
          test "$l" = "$w"
